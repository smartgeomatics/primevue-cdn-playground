<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-Column Layout mit Type Areas</title>
	
	<style>


		html,
		body, #app {
			height: 100%;
			padding:0;
			margin:0;
			overflow: hidden;
		}

		/* =====================================
		   Gesamtlayout
		===================================== */

		.layout {
			display: grid;
			/*gap:1rem;*/
			grid-template-rows:
				auto 
				minmax(0,1fr) 
				auto;
			height: 100dvh;/*height: 100%;min-height: 100%;*/

		}


		/* =====================================
		   Header / Footer
		===================================== */
		
		header {min-height:56px;}

		.header,
		.footer {
			background: rgba(255,0,255,0.35);
			}


		/* =====================================
		   Hilfscontainer für verschiedene Binnenlayouts
		   Type Areas + Satzspiegel
		===================================== */
		
		.wrapper {
			display: grid;
			grid-template-columns: 100vw 100vw;
			height: 100%;
			width: 100vw;
			transition: transform 0.5s ease;
			min-height: 0;
			grid-template-rows: minmax(0,1fr);
		}
			
			.wrapper.wrapper-parallax-shift-map {
				transform: translateX(0vw);
				animation: xxx 1.3s ease-in-out forwards;
				animation-delay: 0.3s;
			}
			
			@keyframes xxx {
				to {
					transform: translateX(-100vw);
				}
			}
		
		.main-layout-map {
			display: grid;
			grid-template-columns:
				56px
				minmax(0, 1fr)
				56px;
			min-height: 0;
			/*overflow:auto;*/
			grid-template-rows:minmax(0,1fr);
			height:100%;
		}
		
		.main-layout-data {
			display: grid;
			grid-template-columns:
				56px
				minmax(0, 1fr)
				56px;
			min-height: 0;
			background:red;
		}

		/* =====================================
		   Type Areas
		===================================== */

		.type-area {
		}

		.type-area-left {
			grid-column: 1;
			padding-top:0.5rem;
			justify-content: center;
			text-align:center;
			background: rgba(255,0,255,0.35);
		}

		.type-area-right {
			grid-column: 3;
			background: rgba(255,0,255,0.35);
		}
		
		.type-area-left {text-align:center;gap:0.5rem;}


		/* =====================================
		   Satzspiegel
		===================================== */

		.content {
			grid-column: 2;
			display: grid;
			/*grid-template-columns:repeat(12, [col-start] 1fr);*/
			grid-template-columns:repeat(12,minmax(0,1fr));
			gap: 1rem;
			grid-template-rows: minmax(0, 1fr);
			min-height: 0;
			/*overflow:hidden;*/
			min-width:0;
		}


		/* =====================================
		   12er Raster
		===================================== */

		.left-sidebar {
			/*grid-column: col-start 1 / span 2;*/
			grid-column: 1 / span 2;
			min-height: 0;
			overflow:auto;
			padding:1rem 0;
			background: rgba(255,0,0,0.35);
		}

		.main {
			/*grid-column: col-start 3 / span 7;*/
			grid-column: 3 / span 7;
			min-height: 0;
			overflow: auto;
			padding:1rem 0;
			background: rgba(0,0,255,0.35);
		}

		.right-sidebar {
			/*grid-column: col-start 10 / span 3;*/
			grid-column: 10 / span 3;
			min-height: 0;
			overflow: auto;
			padding:1rem 0;
			background: rgba(0,255,0,0.35);
		}
		
		
		
		
	</style>
	
	
	
	
	

</head>

<body>
	
	<div class="layout" style="position:relative">

        <header class="header" style="pointer-events: auto;">header
			<a href="css-grid-layout4_satzspiegel_aussenMain_parallax_v3.html">blend-out</a>
		</header>
		
		<div id="wrapper" class="wrapper wrapper-parallax-shift-map">
		
				
			<div class="main-layout-map">
			
				<!-- linke Type Area -->
				<aside class="type-area type-area-left">Type Area / Map Menü</aside>

				<main class="content">

					<aside class="left-sidebar">Legend Control</aside>

					<section class="main">Main</section>

					<aside class="right-sidebar">Legend Info</aside>

				</main>
				
				<!-- rechte Type Area -->
				<aside class="type-area type-area-right">Type Area / User Menü</aside>
			
			</div>
			
			<div class="main-layout-data">yxcyc</div>
			
		</div>

        <footer class="footer" style="pointer-events: aut;">Footer</footer>
    
	</div>

</body>
</html>
